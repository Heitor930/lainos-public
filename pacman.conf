# ‡ LainOS — pacman.conf usado só na HORA DE MONTAR a ISO.
# O sistema instalado usa o airootfs/etc/pacman.conf.
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
