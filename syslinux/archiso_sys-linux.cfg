LABEL lainos
TEXT HELP
Inicia o LainOS direto do pendrive, sem alterar o computador.
O instalador fica nas boas-vindas da area de trabalho.
ENDTEXT
MENU LABEL LainOS ao vivo
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL lainosram
TEXT HELP
Copia o sistema para a memoria antes de iniciar (pede 6 GB de RAM ou mais).
Depois disso o pendrive pode ser retirado.
ENDTEXT
MENU LABEL LainOS ao vivo (carregar na memoria RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram

LABEL lainossafe
TEXT HELP
Use se a tela ficar preta na opcao normal (video em modo basico).
ENDTEXT
MENU LABEL LainOS ao vivo (video em modo seguro)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset
