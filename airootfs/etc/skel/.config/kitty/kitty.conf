# ‡ LainOS — kitty
# Terminal limpo: muito respiro, pouca cor, nada piscando.

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
modify_font cell_height 112%
disable_ligatures cursor

window_padding_width 16
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
remember_window_size no
initial_window_width  104c
initial_window_height 28c

cursor_shape beam
cursor_beam_thickness 1.6
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.35

scrollback_lines 20000
mouse_hide_wait 2.0
copy_on_select clipboard
strip_trailing_spaces smart
url_style curly
open_url_with default
detect_urls yes

tab_bar_edge top
tab_bar_style separator
tab_separator "   "
tab_bar_margin_height 6 4
tab_title_template "{index} {title}"
active_tab_font_style normal
inactive_tab_font_style normal

background_opacity 0.93
dynamic_background_opacity yes

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0

include colors.conf
