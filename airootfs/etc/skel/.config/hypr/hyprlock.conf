# Tela de bloqueio
source = ~/.config/hypr/lock-bg.conf

general {
    hide_cursor = true
}

background {
    monitor =
    path = $lockbg
    color = rgb(080908)
    blur_passes = 3
    blur_size = 6
    noise = 0.03
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.1
}

# Hora
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = rgba(e8eae4ff)
    font_size = 96
    font_family = Inter Light
    position = 0, 170
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgba(8a9a5bff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(3d4a24ff)
    inner_color = rgba(0d0f0dcc)
    font_color = rgba(e8eae4ff)
    check_color = rgba(8a9a5bff)
    fail_color = rgba(b5564aff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7266">senha</span>
    fail_text = <span foreground="##b5564a">acesso negado</span>
    rounding = 14
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = ‡  $USER
    color = rgba(a3a89bff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 36
    halign = center
    valign = bottom
}
