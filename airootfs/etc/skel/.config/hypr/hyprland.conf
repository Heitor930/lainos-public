# ‡ LainOS — Hyprland
#
# Este arquivo só junta as partes. Para personalizar sem medo de perder
# nada em atualizações, escreva em ~/.config/hypr/user.conf (carregado por
# último, então vence qualquer configuração daqui).
#
# Recarrega sozinho ao salvar. Erros aparecem em: hyprctl configerrors

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/env.conf
source = ~/.config/hypr/conf/look.conf
source = ~/.config/hypr/conf/animations.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/binds.conf
source = ~/.config/hypr/conf/autostart.conf
source = ~/.config/hypr/user.conf
