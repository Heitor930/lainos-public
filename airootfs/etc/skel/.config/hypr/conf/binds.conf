# Atalhos. Tudo aqui também pode ser feito com o mouse (barra, dock e menus).
# Lista completa na tela: SUPER + F1

$mod = SUPER

# --- Aplicativos --------------------------------------------------------
bind = $mod, Return, exec, kitty
bind = $mod, Space,  exec, lain-launcher
bind = $mod, A,      exec, lain-launcher grid
bind = $mod, E,      exec, thunar
bind = $mod, B,      exec, firefox
bind = $mod SHIFT, B, exec, navi-ghost
bind = $mod, O,      exec, knights-osint
bind = $mod, H,      exec, kitty --class hermes -e hermes
bind = $mod, comma,  exec, lainos-welcome

# --- Sistema ------------------------------------------------------------
bind = $mod, F1,     exec, lain-keys
bind = $mod, slash,  exec, lain-keys
bind = $mod, Escape, exec, lain-powermenu
bind = $mod, L,      exec, loginctl lock-session
bind = $mod, N,      exec, swaync-client -t -sw
bind = $mod, W,      exec, lain-wallpaper pick
bind = $mod SHIFT, V, exec, lain-clipboard
bind = $mod SHIFT, P, exec, lain-performance toggle
bind = $mod SHIFT, T, exec, lain-proxy toggle
bind = $mod SHIFT, R, exec, hyprctl reload

# --- Capturas de tela ---------------------------------------------------
bind = , Print,       exec, lain-screenshot region
bind = SHIFT, Print,  exec, lain-screenshot full
bind = $mod, Print,   exec, lain-screenshot window

# --- Janelas ------------------------------------------------------------
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, V, togglefloating,
bind = $mod, J, togglesplit,
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bind = ALT SHIFT, Tab, cyclenext, prev

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# Mouse: SUPER + arrastar move, SUPER + botão direito redimensiona,
# SUPER + clique do meio fecha. As bordas também redimensionam sozinhas.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind  = $mod, mouse:274, killactive,

# --- Áreas de trabalho (layers) -----------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, Tab,       workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Gaveta (área de trabalho escondida)
bind = $mod, S, togglespecialworkspace, gaveta
bind = $mod SHIFT, S, movetoworkspace, special:gaveta

# --- Teclas de mídia ----------------------------------------------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous
