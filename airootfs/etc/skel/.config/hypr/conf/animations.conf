# Animações: movimento com peso e desaceleração longa, sem ser lento.
# As janelas "pousam" passando um fio do ponto e voltando (curva spring).
# Modo leve (desliga blur, sombras e animações): SUPER + SHIFT + P

animations {
    enabled = true

    bezier = wire,   0.22, 1.00, 0.36, 1.00
    bezier = spring, 0.34, 1.32, 0.64, 1.00
    bezier = glide,  0.65, 0.00, 0.35, 1.00
    bezier = soft,   0.25, 0.10, 0.25, 1.00

    animation = global,        1, 6.0, wire

    animation = windowsIn,     1, 5.0, spring, popin 82%
    animation = windowsOut,    1, 3.2, glide,  popin 88%
    animation = windowsMove,   1, 5.0, wire

    animation = fadeIn,        1, 3.0, soft
    animation = fadeOut,       1, 2.4, soft
    animation = fade,          1, 4.0, soft
    animation = fadeDim,       1, 5.0, soft
    animation = border,        1, 8.0, wire

    animation = layersIn,      1, 4.2, spring, popin 90%
    animation = layersOut,     1, 2.8, glide,  fade
    animation = fadeLayersIn,  1, 2.8, soft
    animation = fadeLayersOut, 1, 2.2, soft

    animation = workspaces,       1, 5.5, wire, slidefade 16%
    animation = specialWorkspace, 1, 5.0, wire, slidefadevert 16%
}
