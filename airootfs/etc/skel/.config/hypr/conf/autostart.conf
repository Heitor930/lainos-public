# O que sobe junto com a sessão

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

exec-once = lain-session-init
exec-once = lain-wallpaper
exec-once = waybar
exec-once = swaync
exec-once = lain-dock
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = lain-first-run

# Regras de janela, blur das camadas e gestos: aplicadas por script porque a
# sintaxe muda entre versões do Hyprland (o script tenta a nova e a antiga).
# `exec` (sem -once) roda de novo a cada recarga da configuração.
exec = lain-rules
