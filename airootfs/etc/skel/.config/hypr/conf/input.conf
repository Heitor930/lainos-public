# Teclado, mouse e touchpad.
# O layout do teclado segue o que foi escolhido na instalação (lain-session-init
# aplica na entrada). Para fixar outro, defina em ~/.config/hypr/user.conf.

input {
    kb_layout = br
    numlock_by_default = true

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        clickfinger_behavior = true
        disable_while_typing = true
    }
}
