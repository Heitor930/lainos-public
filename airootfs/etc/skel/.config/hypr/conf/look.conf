# Aparência: preto, branco e verde musgo. Cantos suaves, vidro fosco, sombra funda.

general {
    gaps_in = 5
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(8a9a5bee) rgba(3d4a24ee) 45deg
    col.inactive_border = rgba(262b25aa)

    # Amigável ao mouse: redimensione arrastando a borda de qualquer janela
    resize_on_border = true
    extend_border_grab_area = 14
    hover_icon_on_border = true

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = true
    dim_strength = 0.10

    shadow {
        enabled = true
        range = 26
        render_power = 3
        color = rgba(000000b0)
        offset = 0 6
    }

    blur {
        enabled = true
        size = 6
        passes = 2
        noise = 0.03
        contrast = 0.95
        brightness = 0.86
        vibrancy = 0.10
        popups = true
    }
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(080908)
    animate_manual_resizes = true
    focus_on_activate = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

xwayland {
    force_zero_scaling = true
}
