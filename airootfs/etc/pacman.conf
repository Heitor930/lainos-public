# ‡ LainOS — /etc/pacman.conf do sistema instalado.
# Baseado no padrão do Arch. O multilib (programas 32 bits, Steam) e o
# BlackArch são ligados sob demanda pelo lain-bundle.
[options]
HoldPkg     = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist
