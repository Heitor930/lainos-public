NAME="Servidor próprio"
DESC="Hospede seus serviços: Docker, Caddy (servidor web com HTTPS automático), painel web Cockpit, SSH endurecido com fail2ban e túnel Cloudflare."
ICON="network-server-symbolic"
CATEGORY="uso"
PACKAGES="docker docker-compose docker-buildx caddy cockpit cockpit-storaged cockpit-packagekit openssh fail2ban cloudflared ufw"
SERVICES="docker.socket cockpit.socket"
USER_GROUPS="docker"
NOTE="Painel web do servidor: https://localhost:9090 (entre com seu usuário).
Site rápido na pasta atual: lain-serve
Caddy: edite /etc/caddy/Caddyfile e rode: sudo systemctl enable --now caddy
SSH: sudo systemctl enable --now sshd fail2ban
O firewall segue fechado. Abra só o que for usar, por exemplo: sudo ufw allow 443/tcp"
