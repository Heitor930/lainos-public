NAME="Driver NVIDIA"
DESC="Driver oficial da NVIDIA (módulos abertos) para placas GTX 16xx, RTX e mais novas. Configura o Wayland/Hyprland e refaz a imagem de boot."
ICON="video-display-symbolic"
CATEGORY="sistema"
PACKAGES="nvidia-open nvidia-utils nvidia-settings libva-nvidia-driver egl-wayland"
NOTE="Reinicie o computador para o driver entrar em uso.
Placas antigas (GTX 10xx para trás) não são atendidas por este driver: use os pacotes nvidia-470xx/nvidia-390xx do AUR."

pre_install() {
    if ! lspci -nn 2>/dev/null | grep -Ei 'vga|3d|display' | grep -qi nvidia; then
        printf '    Não encontrei placa NVIDIA neste computador. Nada a fazer.\n'
        return 1
    fi
}

post_install() {
    cat >/etc/modprobe.d/lainos-nvidia.conf <<'CONF'
# LainOS: KMS da NVIDIA ligado cedo, necessário para o Hyprland
options nvidia_drm modeset=1 fbdev=1
CONF
    cat >/etc/mkinitcpio.conf.d/lainos-nvidia.conf <<'CONF'
# LainOS: módulos da NVIDIA na imagem de boot
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
CONF
    mkinitcpio -P
}
