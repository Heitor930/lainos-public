NAME="Arsenal completo (BlackArch)"
DESC="Liga o repositório BlackArch e instala o grupo de pentest mais usado. Milhares de ferramentas extras passam a ficar a um \`pacman -S\` de distância."
ICON="security-high-symbolic"
CATEGORY="arsenal"
NEEDS_BLACKARCH=1
PACKAGES="burpsuite feroxbuster wpscan subfinder amass responder bettercap set beef theharvester dnsrecon"
NOTE="O BlackArch é um repositório oficial para Arch, mantido por https://blackarch.org.
Depois de ligado, veja categorias com \`pacman -Sg | grep blackarch\` e instale grupos inteiros, ex.: \`sudo pacman -S blackarch-webapp\`.
Tudo isto é para testes autorizados, pesquisa e CTF. Você é responsável por usar dentro da lei."
