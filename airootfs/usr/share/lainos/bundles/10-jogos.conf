NAME="Jogos"
DESC="Steam com Proton, Lutris, GameMode e MangoHud. Liga o repositório multilib e instala o driver Vulkan de 32 bits da sua placa."
ICON="input-gaming-symbolic"
CATEGORY="uso"
MULTILIB=1
PACKAGES="steam lutris gamemode lib32-gamemode mangohud lib32-mangohud gamescope wine winetricks"
USER_GROUPS="gamemode"
NOTE="Abra a Steam e ative o Proton em Steam > Configurações > Compatibilidade para rodar jogos de Windows."

# Driver Vulkan 32 bits conforme a GPU (a Steam precisa dele antes de abrir)
extra_packages() {
    local gpu
    gpu=$(lspci -nn 2>/dev/null | grep -Ei 'vga|3d|display' || true)
    local list="lib32-mesa"
    grep -qi 'nvidia' <<<"$gpu" && pacman -Qq nvidia-utils >/dev/null 2>&1 && list+=" lib32-nvidia-utils"
    grep -Eqi 'amd|ati|radeon' <<<"$gpu" && list+=" lib32-vulkan-radeon"
    grep -qi 'intel' <<<"$gpu" && list+=" lib32-vulkan-intel"
    echo "$list"
}
